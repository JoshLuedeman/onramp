name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy
# validation, and allow manual testing through the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        continue-on-error: true

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
        continue-on-error: true

      - name: Install hve-core-all plugin
        run: bash .devcontainer/setup-hve-core.sh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify tools
        run: |
          echo "node: $(node --version 2>&1 || echo 'not found')"
          echo "npm: $(npm --version 2>&1 || echo 'not found')"
          echo "python: $(python --version 2>&1 || echo 'not found')"
          echo "pip: $(pip --version 2>&1 || echo 'not found')"
          echo "copilot: $(copilot --version 2>&1 || echo 'not found')"
          copilot plugin list 2>&1 || echo "copilot plugin list not available"
        continue-on-error: true
